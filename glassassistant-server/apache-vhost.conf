<VirtualHost *:80>
    ServerName api.nobutv.org
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName api.nobutv.org

        SSLEngine On
        SSLCertificateFile /etc/letsencrypt/live/api.nobutv.org/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/api.nobutv.org/privkey.pem

        ProxyRequests Off
        ProxyPreserveHost On
        ProxyAddHeaders On

        ProxyPass /app/ !
        Alias /app/ /var/www/glassassistant-app/current/

        <Directory /var/www/glassassistant-app/current>
            Options -Indexes +FollowSymLinks
            AllowOverride None
            Require all granted
            DirectoryIndex index.html
        </Directory>

        ProxyPass / http://127.0.0.1:3100/ connectiontimeout=5 timeout=120 retry=0
        ProxyPassReverse / http://127.0.0.1:3100/

        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"

        ErrorLog ${APACHE_LOG_DIR}/glassassistant-error.log
        CustomLog ${APACHE_LOG_DIR}/glassassistant-access.log combined
    </VirtualHost>
</IfModule>
