<VirtualHost *:80>
    ServerName api.nobutv.org
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName api.nobutv.org

        SSLEngine On
        SSLCertificateFile /etc/letsencrypt/live/api.nobutv.org/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/api.nobutv.org/privkey.pem

        ProxyPreserveHost On
        ProxyPass / http://127.0.0.1:3000/
        ProxyPassReverse / http://127.0.0.1:3000/

        ErrorLog ${APACHE_LOG_DIR}/glassassistant-error.log
        CustomLog ${APACHE_LOG_DIR}/glassassistant-access.log combined
    </VirtualHost>
</IfModule>
